[package]
name = "magi-unreal-axi"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Agent-facing CLI and native plugin for safe Unreal editor automation and build pipelines"
readme = "README.md"
documentation = "https://docs.rs/magi-unreal-axi"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toon-format = { version = "0.5", default-features = false }
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "magi-unreal-axi"
path = "src/main.rs"
