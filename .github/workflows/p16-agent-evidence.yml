name: p16-agent-evidence-producer

on:
  workflow_dispatch:
    inputs:
      certification_tag:
        description: Exact immutable v* certification tag
        required: true
        type: string
      certification_ref:
        description: Exact tag ref
        required: true
        type: string
      certification_run_id:
        description: Successful trusted certification producer run ID
        required: true
        type: string
      finalized_run_directory:
        description: Finalized local run directory under protected P16_AGENT_EVIDENCE_ROOT
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: [self-hosted, macOS, arm64, unreal-5.8.1]
    environment: p16-agent-evidence
    permissions:
      contents: read
      actions: read
    env:
      CERTIFICATION_TAG: ${{ inputs.certification_tag }}
      CERTIFICATION_REF: ${{ inputs.certification_ref }}
      CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
      FINALIZED_RUN_DIRECTORY: ${{ inputs.finalized_run_directory }}
      P16_AGENT_EVIDENCE_ROOT: ${{ vars.P16_AGENT_EVIDENCE_ROOT }}
      P16_EXPECTED_ARTIFACT_SHA256: ${{ vars.P16_EXPECTED_ARTIFACT_SHA256 }}
      P16_EXPECTED_SOURCE_COMMIT: ${{ vars.P16_EXPECTED_SOURCE_COMMIT }}
      P16_EXPECTED_RUN_INVENTORY_SHA256: ${{ vars.P16_EXPECTED_RUN_INVENTORY_SHA256 }}
      P16_EXPECTED_COMBINED_EVIDENCE_TREE_SHA256: ${{ vars.P16_EXPECTED_COMBINED_EVIDENCE_TREE_SHA256 }}
      TRUSTED_SOURCE: ${{ github.workspace }}/trusted-source
      P16_EVIDENCE_ROOT: ${{ runner.temp }}/p16-agent-evidence
    steps:
      - name: Checkout exact trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.P16_EXPECTED_SOURCE_COMMIT }}
          fetch-depth: 0
          path: trusted-source
      - name: Validate trusted run, tag, source, and confined finalized path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CERTIFICATION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$CERTIFICATION_REF" = "refs/tags/$CERTIFICATION_TAG"
          test "$CERTIFICATION_REF" = "$GITHUB_REF"
          [[ "$CERTIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$P16_EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ && "$P16_EXPECTED_ARTIFACT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "$P16_EXPECTED_RUN_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ && "$P16_EXPECTED_COMBINED_EVIDENCE_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$CERTIFICATION_RUN_ID" --jq '[.path,.event,.status,.conclusion,.head_sha,.head_branch] | @tsv')
          IFS=$'\t' read -r path event status conclusion head_sha head_branch <<<"$run"
          [[ "$path" == ".github/workflows/p16-certification.yml" && "$event" == workflow_dispatch && "$status" == completed && "$conclusion" == success && "$head_sha" == "$P16_EXPECTED_SOURCE_COMMIT" && "$head_branch" == "$CERTIFICATION_TAG" ]]
          names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$CERTIFICATION_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | .name' | LC_ALL=C sort)
          test "$names" = $'p16-combined-evidence\np16-release-archive'
          test "$(git -C "$TRUSTED_SOURCE" rev-parse HEAD)" = "$P16_EXPECTED_SOURCE_COMMIT"
          test "$(git -C "$TRUSTED_SOURCE" rev-parse "refs/tags/$CERTIFICATION_TAG^{commit}")" = "$P16_EXPECTED_SOURCE_COMMIT"
          root=$(cd "$P16_AGENT_EVIDENCE_ROOT" && pwd -P)
          run_dir=$(cd "$FINALIZED_RUN_DIRECTORY" && pwd -P)
          case "$run_dir/" in "$root"/*) ;; *) echo 'run directory escapes protected root' >&2; exit 1 ;; esac
          test -f "$run_dir/run-inventory.json" && test -f "$run_dir/manifest.json"
          test "$(jq -r '.sourceCommit' "$run_dir/manifest.json")" = "$P16_EXPECTED_SOURCE_COMMIT"
          test "$(jq -r '.artifactSha256' "$run_dir/manifest.json" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$P16_EXPECTED_ARTIFACT_SHA256" | tr '[:upper:]' '[:lower:]')"
      - name: Download trusted combined evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.certification_run_id }}
          name: p16-combined-evidence
          path: ${{ runner.temp }}/p16-agent-evidence/combined
      - name: Materialize and revalidate exact bytes for upload
        working-directory: trusted-source
        run: |
          set -euo pipefail
          root=$(cd "$P16_AGENT_EVIDENCE_ROOT" && pwd -P)
          run_dir=$(cd "$FINALIZED_RUN_DIRECTORY" && pwd -P)
          test "$(jq -r '.combinedEvidenceTreeSha256' "$run_dir/manifest.json")" = "$P16_EXPECTED_COMBINED_EVIDENCE_TREE_SHA256"
          test "$(jq -r '.treeSha256' "$P16_EVIDENCE_ROOT/combined/evidence-tree.json")" = "$P16_EXPECTED_COMBINED_EVIDENCE_TREE_SHA256"
          test ! -e "$P16_EVIDENCE_ROOT/run"
          ruby -I tests/unreal/support -e 'require "p16-run-inventory"; P16RunInventory.materialize_verified(ARGV.fetch(0), ENV.fetch("P16_EXPECTED_RUN_INVENTORY_SHA256"), ARGV.fetch(1))' "$run_dir" "$P16_EVIDENCE_ROOT/run"
          P16_EXPECTED_RUN_INVENTORY_SHA256="$P16_EXPECTED_RUN_INVENTORY_SHA256" ./tests/unreal/evaluate-p1.6-agents.sh revalidate "$P16_EVIDENCE_ROOT/run" "$P16_EVIDENCE_ROOT/combined"
          test "$(find "$P16_EVIDENCE_ROOT/run" -type f | wc -l | tr -d ' ')" -gt 0
      - name: Upload agent run only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p16-agent-run
          path: ${{ runner.temp }}/p16-agent-evidence/run
          if-no-files-found: error
          include-hidden-files: true
