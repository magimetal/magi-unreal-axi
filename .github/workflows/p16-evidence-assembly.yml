name: p16-evidence-assembly

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Source run containing p16-release-archive
        required: true
        type: string
      combined_run_id:
        description: Source run containing p16-combined-evidence
        required: true
        type: string
      agent_run_id:
        description: Distinct source run containing p16-agent-run
        required: true
        type: string
      review_run_id:
        description: Distinct source run containing p16-independent-review
        required: true
        type: string
      certification_tag:
        description: Exact immutable v* certification tag
        required: true
        type: string
permissions:
  contents: read
  actions: read

concurrency:
  group: p16-evidence-assembly-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: macos-14
    environment: p16-release-gate
    permissions:
      contents: read
      actions: read
    env:
      P16_EXPECTED_ARTIFACT_SHA256: ${{ vars.P16_EXPECTED_ARTIFACT_SHA256 }}
      P16_EXPECTED_SOURCE_COMMIT: ${{ vars.P16_EXPECTED_SOURCE_COMMIT }}
      P16_EXPECTED_RUN_INVENTORY_SHA256: ${{ vars.P16_EXPECTED_RUN_INVENTORY_SHA256 }}
      P16_EXPECTED_COMBINED_EVIDENCE_TREE_SHA256: ${{ vars.P16_EXPECTED_COMBINED_EVIDENCE_TREE_SHA256 }}
      P16_EXPECTED_REVIEW_SHA256: ${{ vars.P16_EXPECTED_REVIEW_SHA256 }}
      P16_EXPECTED_REVIEWER_ID: ${{ vars.P16_EXPECTED_REVIEWER_ID }}
      RELEASE_RUN_ID: ${{ inputs.release_run_id }}
      COMBINED_RUN_ID: ${{ inputs.combined_run_id }}
      AGENT_RUN_ID: ${{ inputs.agent_run_id }}
      REVIEW_RUN_ID: ${{ inputs.review_run_id }}
      CERTIFICATION_TAG: ${{ inputs.certification_tag }}
      TRUSTED_SOURCE: ${{ github.workspace }}/trusted-source
      EVIDENCE_ROOT: ${{ runner.temp }}/p16-evidence
      WORKFLOW_REF: ${{ github.ref }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Validate dispatch, run IDs, and protected trust roots
        run: |
          set -euo pipefail
          [[ "$CERTIFICATION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$WORKFLOW_REF" = "refs/tags/$CERTIFICATION_TAG"
          test "$WORKFLOW_SHA" = "$P16_EXPECTED_SOURCE_COMMIT"
          for value in "$RELEASE_RUN_ID" "$COMBINED_RUN_ID" "$AGENT_RUN_ID" "$REVIEW_RUN_ID"; do
            [[ "$value" =~ ^[1-9][0-9]*$ ]]
          done
          [[ "$AGENT_RUN_ID" != "$RELEASE_RUN_ID" && "$AGENT_RUN_ID" != "$COMBINED_RUN_ID" ]]
          [[ "$REVIEW_RUN_ID" != "$AGENT_RUN_ID" && "$REVIEW_RUN_ID" != "$RELEASE_RUN_ID" && "$REVIEW_RUN_ID" != "$COMBINED_RUN_ID" ]]
          [[ "$P16_EXPECTED_ARTIFACT_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          [[ "$P16_EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$P16_EXPECTED_RUN_INVENTORY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$P16_EXPECTED_COMBINED_EVIDENCE_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$P16_EXPECTED_REVIEW_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$P16_EXPECTED_REVIEWER_ID" =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]]

      - name: Validate exact successful source runs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for specification in \
            "$RELEASE_RUN_ID:p16-release-archive:.github/workflows/p16-certification.yml" \
            "$COMBINED_RUN_ID:p16-combined-evidence:.github/workflows/p16-certification.yml" \
            "$AGENT_RUN_ID:p16-agent-run:.github/workflows/p16-agent-evidence.yml" \
            "$REVIEW_RUN_ID:p16-independent-review:.github/workflows/p16-independent-review.yml"; do
            run_id=${specification%%:*}
            remainder=${specification#*:}
            artifact_name=${remainder%%:*}
            expected_path=${remainder#*:}
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id" --jq '[.path,.event,.status,.conclusion,.head_sha,.head_branch] | @tsv')
            IFS=$'\t' read -r path event status conclusion head_sha head_branch <<<"$run"
            [[ "$path" == "$expected_path" ]] || { echo "source workflow mismatch: $run_id expected=$expected_path actual=$path" >&2; exit 1; }
            [[ "$event" == workflow_dispatch && "$status" == completed && "$conclusion" == success && "$head_sha" == "$P16_EXPECTED_SOURCE_COMMIT" && "$head_branch" == "$CERTIFICATION_TAG" ]] || { echo "source run identity mismatch: $run_id" >&2; exit 1; }
            artifact_count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/artifacts" --paginate --jq ".artifacts[] | select(.name == \"$artifact_name\" and .expired == false) | .id" | wc -l | tr -d ' ')
            [[ "$artifact_count" == 1 ]] || { echo "expected one live exact artifact $artifact_name in run $run_id" >&2; exit 1; }
          done

      - name: Checkout exact trusted source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ vars.P16_EXPECTED_SOURCE_COMMIT }}
          fetch-depth: 0
          path: trusted-source

      - name: Verify exact checkout and certification tag
        run: |
          set -euo pipefail
          test "$(git -C "$TRUSTED_SOURCE" rev-parse HEAD)" = "$P16_EXPECTED_SOURCE_COMMIT"
          test -z "$(git -C "$TRUSTED_SOURCE" status --porcelain=v1 --untracked-files=all)"
          [[ "$CERTIFICATION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git -C "$TRUSTED_SOURCE" rev-parse "refs/tags/$CERTIFICATION_TAG^{commit}")" = "$P16_EXPECTED_SOURCE_COMMIT"
          test "$CERTIFICATION_TAG" = "v$(sed -n 's/^version = \"\(.*\)\"/\1/p' "$TRUSTED_SOURCE/Cargo.toml" | head -1)"

      - name: Download release archive source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.release_run_id }}
          name: p16-release-archive
          path: ${{ runner.temp }}/p16-evidence/release
      - name: Download combined evidence source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.combined_run_id }}
          name: p16-combined-evidence
          path: ${{ runner.temp }}/p16-evidence/combined
      - name: Download agent run source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.agent_run_id }}
          name: p16-agent-run
          path: ${{ runner.temp }}/p16-evidence/agent
      - name: Download independent review source
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.review_run_id }}
          name: p16-independent-review
          path: ${{ runner.temp }}/p16-evidence/review

      - name: Require bounded unique source artifacts
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$TRUSTED_SOURCE/Cargo.toml" | head -1)
          archive="$EVIDENCE_ROOT/release/magi-unreal-axi-${version}-macos-arm64.tar.gz"
          test -f "$archive"
          test "$(find "$EVIDENCE_ROOT/release" -type f -name 'magi-unreal-axi-*.tar.gz' | wc -l | tr -d ' ')" = 1
          test -f "$EVIDENCE_ROOT/release/SHA256SUMS"
          test "$(find "$EVIDENCE_ROOT/release" -type f | wc -l | tr -d ' ')" = 2
          test -f "$EVIDENCE_ROOT/combined/evidence-tree.json"
          test -f "$EVIDENCE_ROOT/agent/run-inventory.json"
          test "$(find "$EVIDENCE_ROOT/review" -type f -name 'independent-review.json' | wc -l | tr -d ' ')" = 1
          test "$(find "$EVIDENCE_ROOT/review" -type f | wc -l | tr -d ' ')" = 1
          test "$(find "$EVIDENCE_ROOT/agent" -type f | wc -l | tr -d ' ')" -le 100000
          test "$(find "$EVIDENCE_ROOT/combined" -type f | wc -l | tr -d ' ')" -le 4096
          (cd "$EVIDENCE_ROOT/release" && shasum -a 256 -c SHA256SUMS)
          actual=$(shasum -a 256 "$archive" | awk '{print tolower($1)}')
          test "$actual" = "$(printf '%s' "$P16_EXPECTED_ARTIFACT_SHA256" | tr '[:upper:]' '[:lower:]')"

      - name: Revalidate agent run and combined evidence
        run: |
          set -euo pipefail
          P16_EXPECTED_RUN_INVENTORY_SHA256="$P16_EXPECTED_RUN_INVENTORY_SHA256" "$TRUSTED_SOURCE/tests/unreal/evaluate-p1.6-agents.sh" revalidate "$EVIDENCE_ROOT/agent" "$EVIDENCE_ROOT/combined"

      - name: Write and verify closure
        run: |
          set -euo pipefail
          archive=$(find "$EVIDENCE_ROOT/release" -type f -name 'magi-unreal-axi-*.tar.gz' -print -quit)
          review="$EVIDENCE_ROOT/review/independent-review.json"
          mkdir -p "$EVIDENCE_ROOT/assembled/closure"
          "$TRUSTED_SOURCE/tests/unreal/close-p1.6.sh" write "$archive" "$EVIDENCE_ROOT/agent" "$EVIDENCE_ROOT/combined" "$review" "$EVIDENCE_ROOT/assembled/closure/closure.json"
          "$TRUSTED_SOURCE/tests/unreal/close-p1.6.sh" verify "$archive" "$EVIDENCE_ROOT/agent" "$EVIDENCE_ROOT/combined" "$review" "$EVIDENCE_ROOT/assembled/closure/closure.json"
          test "$(find "$EVIDENCE_ROOT/assembled/closure" -type f | wc -l | tr -d ' ')" = 1

      - name: Assemble exact output trees
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT/assembled/release" "$EVIDENCE_ROOT/assembled/combined" "$EVIDENCE_ROOT/assembled/agent" "$EVIDENCE_ROOT/assembled/review"
          cp -p "$EVIDENCE_ROOT/release"/* "$EVIDENCE_ROOT/assembled/release/"
          cp -p "$EVIDENCE_ROOT/review/independent-review.json" "$EVIDENCE_ROOT/assembled/review/"
          ditto "$EVIDENCE_ROOT/combined" "$EVIDENCE_ROOT/assembled/combined"
          ditto "$EVIDENCE_ROOT/agent" "$EVIDENCE_ROOT/assembled/agent"
          test "$(find "$EVIDENCE_ROOT/assembled/release" -type f | wc -l | tr -d ' ')" = 2
          test "$(find "$EVIDENCE_ROOT/assembled/review" -type f | wc -l | tr -d ' ')" = 1

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p16-release-archive
          path: ${{ runner.temp }}/p16-evidence/assembled/release/*
          if-no-files-found: error
      - name: Upload combined evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p16-combined-evidence
          path: ${{ runner.temp }}/p16-evidence/assembled/combined
          if-no-files-found: error
      - name: Upload agent run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p16-agent-run
          path: ${{ runner.temp }}/p16-evidence/assembled/agent
          if-no-files-found: error
      - name: Upload independent review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p16-independent-review
          path: ${{ runner.temp }}/p16-evidence/assembled/review/independent-review.json
          if-no-files-found: error
      - name: Upload closure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p16-closure
          path: ${{ runner.temp }}/p16-evidence/assembled/closure/closure.json
          if-no-files-found: error
