name: release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact existing immutable v* tag
        required: true
        type: string
      certification_tag:
        description: Certification tag, exact release tag
        required: true
        type: string
      certification_run_id:
        description: Successful p16-evidence-assembly run
        required: true
        type: string

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  hosted-rust:
    runs-on: macos-14
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      CERTIFICATION_TAG: ${{ inputs.certification_tag }}
      WORKFLOW_REF: ${{ github.ref }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Validate exact tag dispatch
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == "$CERTIFICATION_TAG" && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$WORKFLOW_REF" = "refs/tags/$RELEASE_TAG"
          test "$WORKFLOW_SHA" = "$(git rev-parse HEAD)"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # 1.88.0
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-audit,cargo-deny
          fallback: none
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo run --locked --bin xtask -- capabilities check
      - run: cargo run --locked --bin xtask -- guidance check
      - run: cargo run --locked --bin xtask -- release check
      - run: cargo audit
      - run: cargo deny check

  closure:
    needs: hosted-rust
    runs-on: macos-14
    environment: p16-release-gate
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      CERTIFICATION_TAG: ${{ inputs.certification_tag }}
      CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
      P16_EXPECTED_ARTIFACT_SHA256: ${{ vars.P16_EXPECTED_ARTIFACT_SHA256 }}
      P16_EXPECTED_SOURCE_COMMIT: ${{ vars.P16_EXPECTED_SOURCE_COMMIT }}
      P16_EXPECTED_RUN_INVENTORY_SHA256: ${{ vars.P16_EXPECTED_RUN_INVENTORY_SHA256 }}
      P16_EXPECTED_COMBINED_EVIDENCE_TREE_SHA256: ${{ vars.P16_EXPECTED_COMBINED_EVIDENCE_TREE_SHA256 }}
      P16_EXPECTED_REVIEW_SHA256: ${{ vars.P16_EXPECTED_REVIEW_SHA256 }}
      P16_EXPECTED_REVIEWER_ID: ${{ vars.P16_EXPECTED_REVIEWER_ID }}
      TRUSTED_SOURCE: ${{ github.workspace }}/trusted-source
      WORKFLOW_REF: ${{ github.ref }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Initialize runner-temporary evidence path
        run: |
          test ! -e "$RUNNER_TEMP/release-evidence"
          printf 'EVIDENCE_ROOT=%s\n' "$RUNNER_TEMP/release-evidence" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          path: trusted-source
      - name: Validate immutable tag and certification run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == "$CERTIFICATION_TAG" && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$WORKFLOW_REF" = "refs/tags/$RELEASE_TAG"
          test "$WORKFLOW_SHA" = "$P16_EXPECTED_SOURCE_COMMIT"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$TRUSTED_SOURCE/Cargo.toml" | head -1)
          test "$RELEASE_TAG" = "v$version"
          test "$(git -C "$TRUSTED_SOURCE" rev-parse HEAD)" = "$P16_EXPECTED_SOURCE_COMMIT"
          test "$(git -C "$TRUSTED_SOURCE" rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$P16_EXPECTED_SOURCE_COMMIT"
          test -z "$(git -C "$TRUSTED_SOURCE" status --porcelain=v1 --untracked-files=all)"
          [[ "$CERTIFICATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$CERTIFICATION_RUN_ID" --jq '[.path,.event,.status,.conclusion,.head_sha,.head_branch] | @tsv')
          IFS=$'\t' read -r path event status conclusion head_sha head_branch <<<"$run"
          [[ "$path" == ".github/workflows/p16-evidence-assembly.yml" && "$event" == workflow_dispatch && "$status" == completed && "$conclusion" == success && "$head_sha" == "$P16_EXPECTED_SOURCE_COMMIT" && "$head_branch" == "$CERTIFICATION_TAG" ]]
          artifact_names=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$CERTIFICATION_RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.expired == false) | .name' | LC_ALL=C sort)
          test "$artifact_names" = $'p16-agent-run\np16-closure\np16-combined-evidence\np16-independent-review\np16-release-archive'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.certification_run_id }}
          name: p16-release-archive
          path: ${{ runner.temp }}/release-evidence/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.certification_run_id }}
          name: p16-combined-evidence
          path: ${{ runner.temp }}/release-evidence/combined
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.certification_run_id }}
          name: p16-agent-run
          path: ${{ runner.temp }}/release-evidence/agent
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.certification_run_id }}
          name: p16-independent-review
          path: ${{ runner.temp }}/release-evidence/review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.certification_run_id }}
          name: p16-closure
          path: ${{ runner.temp }}/release-evidence/closure
      - name: Verify closure and retain exact bytes
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' "$TRUSTED_SOURCE/Cargo.toml" | head -1)
          archive="$EVIDENCE_ROOT/release/magi-unreal-axi-${version}-macos-arm64.tar.gz"
          test "$(find "$EVIDENCE_ROOT/release" -type f | wc -l | tr -d ' ')" = 2
          test "$(find "$EVIDENCE_ROOT/review" -type f | wc -l | tr -d ' ')" = 1
          test "$(find "$EVIDENCE_ROOT/closure" -type f | wc -l | tr -d ' ')" = 1
          (cd "$EVIDENCE_ROOT/release" && shasum -a 256 -c SHA256SUMS)
          "$TRUSTED_SOURCE/tests/unreal/close-p1.6.sh" verify "$archive" "$EVIDENCE_ROOT/agent" "$EVIDENCE_ROOT/combined" "$EVIDENCE_ROOT/review/independent-review.json" "$EVIDENCE_ROOT/closure/closure.json"
          mkdir -p "$EVIDENCE_ROOT/validated"
          cp -p "$archive" "$EVIDENCE_ROOT/validated/"
          cp -p "$EVIDENCE_ROOT/release/SHA256SUMS" "$EVIDENCE_ROOT/validated/"
          printf 'tag=%s\ncertificationRunId=%s\nsourceCommit=%s\nartifactSha256=%s\nclosure=verified\n' "$RELEASE_TAG" "$CERTIFICATION_RUN_ID" "$P16_EXPECTED_SOURCE_COMMIT" "$(shasum -a 256 "$archive" | cut -d' ' -f1)" > "$EVIDENCE_ROOT/validated/release-receipt.txt"
      - name: Upload exact validated release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: p16-validated-release
          path: ${{ runner.temp }}/release-evidence/validated/*
          if-no-files-found: error

  # Server prerequisites: p16-release-gate permits selected immutable v* tags only,
  # requires independent approval, prevents self-review, and disallows bypass. A
  # repository ruleset denies update/deletion of v* tags without bypass.
  publish:
    needs: closure
    runs-on: macos-14
    environment: p16-release-gate
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      EXPECTED_SOURCE_COMMIT: ${{ vars.P16_EXPECTED_SOURCE_COMMIT }}
      WORKFLOW_REF: ${{ github.ref }}
      WORKFLOW_SHA: ${{ github.sha }}
    steps:
      - name: Initialize runner-temporary validated path
        run: |
          test ! -e "$RUNNER_TEMP/validated-release"
          printf 'VALIDATED_ROOT=%s\n' "$RUNNER_TEMP/validated-release" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: p16-validated-release
          path: ${{ runner.temp }}/validated-release
      - name: Recheck immutable tag and validated bytes
        run: |
          set -euo pipefail
          test "$WORKFLOW_REF" = "refs/tags/$RELEASE_TAG"
          test "$WORKFLOW_SHA" = "$EXPECTED_SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$EXPECTED_SOURCE_COMMIT"
          test "$(find "$VALIDATED_ROOT" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 3
          test "$(find "$VALIDATED_ROOT" -maxdepth 1 -type f -name 'magi-unreal-axi-*.tar.gz' | wc -l | tr -d ' ')" = 1
          (cd "$VALIDATED_ROOT" && shasum -a 256 -c SHA256SUMS)
          grep -Fxq "tag=$RELEASE_TAG" "$VALIDATED_ROOT/release-receipt.txt"
          grep -Fxq "sourceCommit=$EXPECTED_SOURCE_COMMIT" "$VALIDATED_ROOT/release-receipt.txt"
      - name: Atomically create, verify, and publish exact release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive=$(find "$VALIDATED_ROOT" -maxdepth 1 -type f -name 'magi-unreal-axi-*.tar.gz' -print -quit)
          owner="magi-unreal-axi/p16-release/v1 tag=$RELEASE_TAG sourceCommit=$EXPECTED_SOURCE_COMMIT"
          stale="$RUNNER_TEMP/stale-p16-release-ids"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.draft == true and .tag_name == \"$RELEASE_TAG\" and .body == \"$owner\") | .id" >"$stale"
          test "$(wc -l <"$stale" | tr -d ' ')" -le 1
          if test -s "$stale"; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$(cat "$stale")"
          fi
          release_id=
          cleanup_release() {
            status=$?
            trap - EXIT
            if test "$status" -ne 0 && test -n "$release_id"; then
              draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id" --jq '.draft' 2>/dev/null || true)
              test "$draft" != true || gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$release_id" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup_release EXIT
          release=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$EXPECTED_SOURCE_COMMIT" \
            -f name="$RELEASE_TAG" -f body="$owner" -F draft=true -F prerelease=false)
          release_id=$(jq -er '.id' <<<"$release")
          for path in "$archive" "$VALIDATED_ROOT/SHA256SUMS" "$VALIDATED_ROOT/release-receipt.txt"; do
            name=$(basename "$path")
            curl --fail-with-body --silent --show-error \
              -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/octet-stream' \
              --data-binary "@$path" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$name" \
              >"$RUNNER_TEMP/upload-$name.json"
            asset_id=$(jq -er '.id' "$RUNNER_TEMP/upload-$name.json")
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/$asset_id" >"$RUNNER_TEMP/download-$name"
            cmp -s "$path" "$RUNNER_TEMP/download-$name"
          done
          assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/$release_id/assets" --jq 'map(.name) | sort | join("\n")')
          test "$assets" = "$(printf '%s\n' SHA256SUMS "$(basename "$archive")" release-receipt.txt | LC_ALL=C sort)"
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/$release_id" -F draft=false >/dev/null
          trap - EXIT